name: CI
# ci-lint: allow C11 — 공개 리포라 비공개 rchemist/harness 의 ci-gate 액션을 쓸 수 없다(action not found). main push 재검증을 유지한다.

# Check lane — harness docs/integrations/ci-pipeline.md §2.
# push main + pull_request, light checks on the impacted scope only, target
# wall ≤ 10 min. Heavy runs never execute on CI (§1, 2026-10-23): the former
# `e2e` job and the full unit suite + coverage floors live in scripts/ci/
# (e2e.sh, unit-full.sh) and run locally by the integration-stage owner.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'documents/**', '.dev/**', 'LICENSE']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'documents/**', '.dev/**', 'LICENSE']

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # 드래프트 PR 은 건너뛰고 ready_for_review 에서 돈다(C12).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, ci-light]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/ci/test-impacted.sh diffs against the PR base / push `before`.
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run type-check

      - name: Type check (v0.4 packages — composite tsc -b)
        run: npm run typecheck:packages

      - name: Public surface count
        run: npm run check:surface

      - name: EntityForm sample proof inventory
        run: npm run check:entityform-sample-proof

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests (impacted scope — vitest related, ci-pipeline.md §5)
        env:
          IMPACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci/test-impacted.sh

      - name: Build
        run: npm run build

      - name: Verify build output (dual ESM+CJS + styles)
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          test -f dist/index.d.cts
          test -f dist/styles.css
          test -f dist/styles/tokens.css
          test -f dist/styles/primitives.css
          test -f dist/styles/layouts.css
          test -f dist/styles/components.css
          test -f dist/styles/base.css

      - name: publint (package.json / exports integrity)
        run: npx publint

      - name: Are the types wrong? (attw)
        run: npm run check:exports

      - name: Load smoke (npm pack → install → require/import published exports)
        run: bash scripts/smoke-load.sh
