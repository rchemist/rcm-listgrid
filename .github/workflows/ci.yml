name: CI

on:
  push:
    branches: [main, v0.4]
  pull_request:
    branches: [main, v0.4]

jobs:
  quality:
    runs-on: [self-hosted, Linux, ARM64, s2]
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run type-check

      - name: Type check (v0.4 packages — composite tsc -b)
        run: npm run typecheck:packages

      - name: Public surface count
        run: npm run check:surface

      - name: EntityForm sample proof inventory
        run: npm run check:entityform-sample-proof

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test + coverage (enforces vitest.config.ts thresholds)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Verify build output (dual ESM+CJS + styles)
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          test -f dist/index.d.cts
          test -f dist/styles.css
          test -f dist/styles/tokens.css
          test -f dist/styles/primitives.css
          test -f dist/styles/layouts.css
          test -f dist/styles/components.css
          test -f dist/styles/base.css

      - name: publint (package.json / exports integrity)
        run: npx publint

      - name: Are the types wrong? (attw)
        run: npm run check:exports

      - name: Load smoke (npm pack → install → require/import published exports)
        run: bash scripts/smoke-load.sh

  e2e:
    # v0.4 vertical-slice acceptance — drives apps/sample (new @listgrid/*
    # engine + mock RCM backend) in a real browser (documents/plans/
    # e2e-parity-vertical-slice.md). Runs once (not per node matrix).
    runs-on: [self-hosted, Linux, ARM64, s2]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright — College / Subject / Professor)
        run: npm run test:e2e

      - name: EntityForm proof persistence (real Next restarts)
        run: npm run test:e2e:persistence

      - name: EntityForm proof production smoke (next start + Chromium)
        run: npm run test:sample-production-smoke
