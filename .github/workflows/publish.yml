name: Publish

# Release lane — harness docs/integrations/ci-pipeline.md §2 (tags v*).
# No workflow_dispatch on purpose: the dist-tag is derived from the tag name,
# so a dispatch from a branch ref would publish under the wrong tag.

on:
  push:
    tags:
      - 'v*'
    # GitHub does not evaluate path filters on tag pushes; kept for the lane shape (C9).
    paths-ignore: ['**.md', 'docs/**', 'documents/**', '.dev/**', 'LICENSE']

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    # npm --provenance requires a GitHub-hosted runner (E422 on self-hosted).
    # Zero mesh dependency (public npm registry only), so ubuntu-latest is allowed (§4).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Check release docs (CHANGELOG top == package.json version)
        run: node scripts/check-release-docs.mjs

      - name: Publish (prepublishOnly runs type-check + test + build)
        run: |
          TAG_NAME="${GITHUB_REF_NAME#v}"
          case "$TAG_NAME" in
            *-*)   NPM_TAG="next"       ;;  # prerelease (0.4.0-alpha.N/beta/rc) -> dist-tag next
            0.2.*) NPM_TAG="legacy-0.2" ;;
            *)     NPM_TAG="latest"     ;;
          esac
          echo "Publishing $TAG_NAME with dist-tag $NPM_TAG"
          npm publish --provenance --access public --tag "$NPM_TAG"
