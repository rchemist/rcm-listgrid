name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Publish (prepublishOnly runs type-check + test + build)
        run: |
          TAG_NAME="${GITHUB_REF_NAME#v}"
          case "$TAG_NAME" in
            0.2.*) NPM_TAG="legacy-0.2" ;;
            *)     NPM_TAG="latest"     ;;
          esac
          echo "Publishing $TAG_NAME with dist-tag $NPM_TAG"
          npm publish --provenance --access public --tag "$NPM_TAG"
